<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>首爾 4日3夜互動旅遊行程</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--paper:#f7f5f1;--white:#fff;--line:#e6e8ec;--accent:#ec6f66}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink)}
    header{background:#111827;color:white;padding:42px 20px}.wrap{max-width:980px;margin:auto}.eyebrow{color:#fecaca;font-size:14px}.hero{font-size:clamp(34px,7vw,64px);line-height:1.05;margin:12px 0}.lead{color:#cbd5e1;line-height:1.7}.base{display:inline-block;background:#ffffff14;padding:12px 15px;border-radius:14px;margin-top:10px}
    main{padding:24px 16px 48px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tab{border:0;background:white;border-radius:16px;padding:14px;text-align:left;box-shadow:0 2px 10px #0000000b;cursor:pointer}.tab.active{background:#111827;color:white}.tab small{display:block;opacity:.55;margin-bottom:4px}.panel{display:none}.panel.active{display:block}.dayhead{margin-top:18px;color:white;padding:24px;border-radius:24px;background:linear-gradient(135deg,#ec6f66,#f6aa61)}.dayhead.green{background:linear-gradient(135deg,#10b981,#2dd4bf)}.dayhead.purple{background:linear-gradient(135deg,#8b5cf6,#d946ef)}.dayhead.blue{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
    .routebox{background:#ffffff25;border-radius:14px;padding:14px;margin:16px 0}.mapbtn,.placebtn{display:inline-block;text-decoration:none;font-weight:700;border-radius:12px;padding:11px 14px}.mapbtn{background:white;color:#111827}.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;font-size:16px}.list{display:grid;gap:10px}.stop{background:white;border-radius:16px;box-shadow:0 2px 10px #0000000b;overflow:hidden}.stop button{width:100%;border:0;background:white;padding:17px;text-align:left;display:flex;gap:13px;align-items:center;cursor:pointer}.num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#111827;color:white;font-weight:800;flex:0 0 auto}.names{font-weight:750}.en{font-size:13px;color:var(--muted);margin-top:3px}.details{display:none;border-top:1px solid #f0f1f3;padding:15px 17px;color:#475467;line-height:1.6}.stop.open .details{display:block}.placebtn{margin-top:10px;background:#111827;color:white;font-size:14px}.overview{margin-top:24px;background:white;padding:20px;border-radius:22px}.overview-item{padding:13px 0;border-bottom:1px solid var(--line)}.overview-item:last-child{border-bottom:0}.hint{font-size:13px;color:var(--muted)}
    @media(max-width:640px){.tabs{grid-template-columns:repeat(2,1fr)}header{padding-top:30px}.hero{font-size:40px}}
  </style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">SEOUL · 4日3夜</div><h1 class="hero">女生質感 Shopping & Café 互動行程</h1><p class="lead">明洞 → 聖水 → 漢南洞 → 汝矣島。按景點可展開介紹，亦可直接開啟 Google Maps。</p><div class="base">🏨 住宿 Base：충무로역（忠武路站）</div></div></header>
<main><div class="wrap">
<div class="tabs" id="tabs"></div><div id="panels"></div>
<section class="overview"><h2>四日路線總覽</h2><div id="overview"></div><p class="hint">提示：韓國步行導航亦可將韓文地名複製到 Naver Map 搜尋。</p></section>
</div></main>
<script>
const days=[
{day:1,name:'明洞',title:'明洞｜輕鬆補貨日',sub:'化妝品、手信、明洞街頭與 Myth 豬手',cls:'',summary:'충무로역（忠武路站）→ 명동역（明洞站）',transport:'地鐵 4 號線，1 個站',origin:'Chungmuro Station, Seoul',dest:'Myeongdong Station, Seoul',stops:[
['명동거리','明洞商店街','Myeongdong Shopping Street','Olive Young、化妝品、面膜、飾物及手信'],['명동8길 · 명동10길','明洞8街 · 明洞10街','Myeongdong 8-gil · 10-gil','集中行街及搵小食'],['명동성당','明洞聖堂','Myeongdong Cathedral','順路散步及拍照'],['미쓰족발','Myth 豬手','Myth Jokbal','晚餐，出發前以地圖確認最新分店']]},
{day:2,name:'聖水',title:'首爾林 → 聖水｜潮流 Café Day',sub:'由首爾林站行到聖水站，全程順路不回頭',cls:'green',summary:'충무로역（忠武路站）→ 서울숲역（首爾林站）',transport:'完成行程後由 성수역（聖水站）離開',origin:'Chungmuro Station, Seoul',dest:'Seoul Forest Station, Seoul',stops:[
['서울숲','首爾林','Seoul Forest','先散步、拍照，建議停留 45 至 60 分鐘'],['언더스탠드에비뉴','貨櫃文創街','UNDER STAND AVENUE','特色小店、快閃活動及拍照區'],['서울숲 아틀리에길','首爾林工作室街','Seoul Forest Atelier Street','午餐、咖啡與選物店集中地'],['연무장길','延武場路','Yeonmujang-gil','快閃店、品牌店與伴手禮店集中地'],['LCDC 서울','LCDC 首爾','LCDC SEOUL','服飾、生活選物、咖啡與建築空間'],['올리브영N 성수','Olive Young N 聖水店','OLIVE YOUNG N Seongsu','最後補貨，之後由聖水站回酒店']]},
{day:3,name:'漢南洞',title:'漢南洞｜成熟質感 Shopping Day',sub:'設計品牌、香氛、選物店與慢活 Café',cls:'purple',summary:'충무로역（忠武路站）→ 한강진역（漢江鎮站）',transport:'按即時地圖轉乘至地鐵 6 號線',origin:'Chungmuro Station, Seoul',dest:'Hangangjin Station, Seoul',stops:[
['한남동','漢南洞','Hannam-dong','由漢江鎮站開始，沿斜路慢慢行'],['사운즈 한남','Sounds 漢南','Sounds Hannam','複合式空間、餐廳、生活選物與設計小店'],['앤트러사이트 한남','Anthracite 漢南店','Anthracite Hannam','工業風咖啡店，可作休息站'],['한남동 쇼핑거리','漢南洞購物街','Hannam Shopping Street','韓國設計品牌、服飾及選物店'],['탬버린즈 · 논픽션','Tamburins · Nonfiction','Tamburins · Nonfiction','香氛及生活品味品牌'],['한남동 맛집','漢南洞人氣餐廳','Hannam Restaurants','晚餐可選韓式 Fusion、Italian 或 Wine Bistro']]},
{day:4,name:'汝矣島',title:'汝矣島｜The Hyundai 輕鬆收尾',sub:'百貨購物、美食與漢江散步',cls:'blue',summary:'충무로역（忠武路站）→ 여의도역（汝矣島站）',transport:'可由汝矣島站步行到 The Hyundai Seoul',origin:'Chungmuro Station, Seoul',dest:'The Hyundai Seoul',stops:[
['더현대 서울','首爾現代百貨','The Hyundai Seoul','Fashion、Beauty、快閃店、Lifestyle 與地下美食街'],['더현대 서울 카페','首爾現代百貨咖啡店','The Hyundai Seoul Cafés','按當日排隊情況揀 Café'],['여의도 한강공원','汝矣島漢江公園','Yeouido Hangang Park','天氣好可加插散步，欣賞漢江景色']]}
];
const dir=(o,d)=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(d)}&travelmode=transit`;
const search=q=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q+' Seoul')}`;
const tabs=document.querySelector('#tabs'),panels=document.querySelector('#panels'),overview=document.querySelector('#overview');
days.forEach((d,i)=>{tabs.insertAdjacentHTML('beforeend',`<button class="tab ${i===0?'active':''}" data-day="${d.day}"><small>DAY ${d.day}</small><b>${d.name}</b></button>`);panels.insertAdjacentHTML('beforeend',`<section class="panel ${i===0?'active':''}" data-panel="${d.day}"><div class="dayhead ${d.cls}"><small>DAY ${d.day}</small><h2>${d.title}</h2><p>${d.sub}</p><div class="routebox"><b>🚇 ${d.summary}</b><br><span>${d.transport}</span></div><a class="mapbtn" target="_blank" href="${dir(d.origin,d.dest)}">開啟 Google Maps 地鐵路線 ↗</a></div><input class="search" placeholder="搜尋景點、咖啡或購物地點..."><div class="list">${d.stops.map((s,n)=>`<article class="stop" data-text="${s.join(' ').toLowerCase()}"><button><span class="num">${n+1}</span><span><span class="names">${s[0]}（${s[1]}）</span><span class="en">${s[2]}</span></span></button><div class="details">${s[3]}<br><a class="placebtn" target="_blank" href="${search(s[0]+' '+s[2])}">在 Google Maps 查看 ↗</a></div></article>`).join('')}</div></section>`);overview.insertAdjacentHTML('beforeend',`<div class="overview-item"><b>Day ${d.day} · ${d.name}</b><br>${d.summary} · <a target="_blank" href="${dir(d.origin,d.dest)}">即時路線 ↗</a></div>`)});
document.addEventListener('click',e=>{const tab=e.target.closest('.tab');if(tab){document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.querySelector(`[data-panel="${tab.dataset.day}"]`).classList.add('active');scrollTo({top:260,behavior:'smooth'})}const btn=e.target.closest('.stop button');if(btn)btn.parentElement.classList.toggle('open')});
document.querySelectorAll('.search').forEach(inp=>inp.addEventListener('input',()=>{inp.closest('.panel').querySelectorAll('.stop').forEach(s=>s.style.display=s.dataset.text.includes(inp.value.toLowerCase())?'block':'none')}));
</script></body></html>
